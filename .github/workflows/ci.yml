name: Lab3 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start application and Selenium Grid
        run: |
          mkdir -p reports
          docker compose up -d web-gw0 web-gw1 selenium-hub chrome

      - name: Run parallel tests
        run: docker compose run --rm tests

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/containers.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v
